config_version = 14

[audio]
enable_overdrive = true
enable_sounds = false

[bar]
order = [ "default" ]

    [bar.default]
    capsule = false
    center = [ "workspaces" ]
    end = [
        "tray",
        "warp",
        "nightlight",
        "notifications",
        "caffeine",
        "battery",
        "network",
        "bluetooth",
        "volume",
        "brightness",
        "wallpaper",
        "control-center"
    ]
    margin_edge = 0
    margin_ends = 0
    position = "bottom"
    radius = 0
    shadow = false
    start = [ "session", "launcher", "clipboard", "weather", "clock" ]
    widget_spacing = 10

[control_center]
sidebar_section = "none"

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
auto_hide = true
cross_axis_padding = 0
icon_size = 40
item_spacing = 0
launcher_position = "end"
magnification = false
main_axis_padding = 0
margin_edge = 0
radius = 0
reserve_space = false
show_dots = true

[idle]
behavior_order = [ "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 660.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 600.0

[keybinds]
down = [ "Down", "Ctrl+j" ]
left = [ "Left", "Ctrl+h" ]
right = [ "Right", "Ctrl+l" ]
up = [ "Up", "Ctrl+k" ]

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 961.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true

[notification]
background_opacity = 0.89999997988343239
offset_x = 8
position = "bottom_right"

[osd]
background_opacity = 0.89999997988343239
offset_x = 8
position = "bottom_right"
position_vertical = "bottom_right"

[plugin_settings."levi/warp"]
panel_placement = "floating"
panel_position = "bottom_right"

[plugins]
enabled = [ "noctalia/wallhaven", "levi/warp" ]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[shell]
corner_radius_scale = 0.0
polkit_agent = true

    [shell.animation]
    enabled = false
    speed = 4.0

    [shell.launcher]
    compact = true

    [shell.panel]
    clipboard_position = "bottom_left"
    control_center_placement = "floating"
    control_center_position = "auto"
    open_near_click_control_center = true
    launcher_position = "bottom_left"
    polkit_position = "bottom_left"
    session_placement = "floating"
    session_position = "bottom_left"
    wallpaper_placement = "floating"
    wallpaper_position = "bottom_right"

    [shell.screenshot]
    annotate = true
    confirm_region = true
    directory = "~/screenshots"
    save_to_file = false
    skip_annotate_on_copy_save = true

    [shell.shadow]
    alpha = 0.29999999329447746
    direction = "center"

[theme]
builtin = "Kanagawa"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4" ]

[wallpaper]
directory = "~/wallpapers"
directory_dark = "~/wallpapers"
directory_light = "~/wallpapers"
fill_mode = "span"
transition = [ "fade" ]
transition_duration = 100

    [wallpaper.default]
    path = "/home/doeke/wallpapers/wallhaven-0pyd6p.jpg"

    [wallpaper.last]
    path = "/home/doeke/wallpapers/wallhaven-0pyd6p.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/doeke/wallpapers/wallhaven-0pyd6p.jpg"

[weather]
unit = "imperial"

[widget.battery]
display_mode = "graphic"
show_label = false

[widget.brightness]
show_label = false

[widget.clock]
format = "{:%A %e %B  %X}"

[widget.input_volume]
show_label = false

[widget.network]
show_label = false

[widget.tray]
detached_panel = true
hidden = [ "slack", "Warp-taskbar" ]

[widget.volume]
show_label = false

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"

[widget.warp]
type = "levi/warp:warp"
